# Builds an UNSIGNED iOS .ipa for personal sideloading (Sideloadly / AltStore
# re-sign it with your Apple ID). Manual trigger only: macOS minutes are expensive.
name: iOS unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build (no code signing)
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 50

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/${SCHEME}.app" Payload/
          zip -qr Level90-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Level90-unsigned-ipa
          path: Level90-unsigned.ipa
          retention-days: 14
