# Builds an UNSIGNED iOS .ipa for personal sideloading (Sideloadly / AltStore
# re-sign it with your Apple ID). Manual trigger only: macOS minutes are expensive.
name: iOS unsigned IPA

on:
  workflow_dispatch:

defaults:
  run:
    # Explicit bash => -eo pipefail, so a failing command in a pipe fails the step.
    shell: bash

jobs:
  build:
    # Expo SDK 57 requires Xcode 26.4+, which ships on the macOS 26 image.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.4.1 (Expo SDK 57 minimum is 26.4)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build (no code signing)
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          set +e
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > xcodebuild.log 2>&1
          STATUS=$?
          set -e
          echo "---- errors ----"
          grep -nE "error:|\*\* BUILD FAILED \*\*|The following build commands failed" xcodebuild.log | head -n 60 || true
          echo "---- last lines ----"
          tail -n 60 xcodebuild.log
          exit $STATUS

      - name: Package .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/${SCHEME}.app"
          # Refuse to ship an empty or partial app bundle.
          test -f "$APP/$SCHEME" || { echo "App binary missing: $APP/$SCHEME"; ls -la "$APP" || true; exit 1; }
          test -f "$APP/main.jsbundle" || { echo "JS bundle missing in $APP"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr Level90-unsigned.ipa Payload
          ls -lh Level90-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Level90-unsigned-ipa
          path: Level90-unsigned.ipa
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
